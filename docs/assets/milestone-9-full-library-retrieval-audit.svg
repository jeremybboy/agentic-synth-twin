<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Milestone 9 full-library perceptual timbre retrieval audit</title>
  <desc id="desc">Six-stage map from ten fixed external targets through the complete Surge XT factory library, eligibility separation, perceptual descriptors, dual ranking, human audit, and unchanged local CMA refinement.</desc>
  <rect width="1600" height="900" fill="#09131f"/>
  <style>
    .h1{font:700 45px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f4f7fb}.sub{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9fb0c3}.num{font:800 35px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.head{font:750 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f4f7fb}.body{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#c9d4df}.small{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9fb0c3}.label{font:800 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.7px}.line{stroke:#476077;stroke-width:2}.arrow{stroke:#d4dee8;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#d4dee8"/></marker></defs>
  <text x="52" y="70" class="h1">Agentic Synth Twin</text>
  <text x="52" y="105" class="sub">Full-library perceptual timbre retrieval audit · transparent hypothesis, real Surge renders, human listening gate</text>

  <g transform="translate(45 150)">
    <rect width="235" height="490" rx="10" fill="#102337" stroke="#2e5d89"/>
    <text x="18" y="48" class="num" fill="#45a9ff">1.</text><text x="68" y="45" class="head">Target</text>
    <text x="18" y="82" class="body"><tspan x="18" dy="0">10 fixed external C3</tspan><tspan x="18" dy="26">procedural references</tspan></text>
    <rect x="18" y="145" width="199" height="86" rx="7" fill="#0a1724" stroke="#26445f"/>
    <path d="M28 188 C42 155 58 218 72 181 S101 162 116 194 S145 210 160 176 S190 191 207 184" fill="none" stroke="#45a9ff" stroke-width="3"/>
    <text x="18" y="270" class="small"><tspan x="18">44.1 kHz · stereo PCM16</tspan><tspan x="18" dy="23">2.5 s · MIDI C3 contract</tspan><tspan x="18" dy="23">No playback modification</tspan></text>
    <rect x="18" y="358" width="199" height="96" rx="7" fill="#0a1724"/>
    <text x="31" y="384" class="label" fill="#45a9ff">ANALYSIS ONLY</text>
    <text x="31" y="411" class="small">Stereo → mono</text><text x="31" y="434" class="small">Fixed RMS normalization</text>
  </g>
  <path d="M285 395H318" class="arrow"/>

  <g transform="translate(325 150)">
    <rect width="235" height="490" rx="10" fill="#102337" stroke="#347b5b"/>
    <text x="18" y="48" class="num" fill="#3dd790">2.</text><text x="68" y="45" class="head">Full library</text>
    <text x="18" y="82" class="body"><tspan x="18">Every pinned Surge XT</tspan><tspan x="18" dy="26">1.3.4 factory preset</tspan></text>
    <g transform="translate(18 142)">
      <rect width="199" height="58" rx="7" fill="#173249"/><text x="13" y="25" class="label" fill="#d6e5f3">FACTORY TOTAL</text><text x="13" y="47" class="small">637 enumerated</text>
      <rect y="72" width="199" height="76" rx="7" fill="#143429"/><text x="13" y="97" class="label" fill="#3dd790">RETRIEVAL ELIGIBLE</text><text x="13" y="122" class="small">State + deterministic audio</text><text x="13" y="143" class="small">Audible · unclipped · hashed</text>
      <rect y="162" width="199" height="76" rx="7" fill="#392d18"/><text x="13" y="187" class="label" fill="#ffad4a">SEARCH ELIGIBLE</text><text x="13" y="212" class="small">Retrieval eligible + exact</text><text x="13" y="233" class="small">approved 8-control inventory</text>
    </g>
    <text x="18" y="420" class="small"><tspan x="18">One target-independent cache</tspan><tspan x="18" dy="23">No rerender on target switch</tspan></text>
  </g>
  <path d="M565 395H598" class="arrow"/>

  <g transform="translate(605 150)">
    <rect width="235" height="490" rx="10" fill="#102337" stroke="#7158aa"/>
    <text x="18" y="48" class="num" fill="#ae83ff">3.</text><text x="68" y="45" class="head">4 families</text>
    <text x="18" y="82" class="body">Uncapped raw distances</text>
    <g transform="translate(18 126)">
      <rect width="199" height="60" rx="7" fill="#241e40"/><text x="12" y="25" class="label" fill="#ae83ff">55% LOG-MEL</text><text x="12" y="47" class="small">3 FFT / hop resolutions</text>
      <rect y="74" width="199" height="60" rx="7" fill="#173249"/><text x="12" y="99" class="label" fill="#45a9ff">25% ENVELOPE</text><text x="12" y="121" class="small">Shape + attack + decay</text>
      <rect y="148" width="199" height="60" rx="7" fill="#143429"/><text x="12" y="173" class="label" fill="#3dd790">15% HARMONIC</text><text x="12" y="195" class="small">Harmonic / noise / inharm.</text>
      <rect y="222" width="199" height="60" rx="7" fill="#392d18"/><text x="12" y="247" class="label" fill="#ffad4a">5% FLATNESS</text><text x="12" y="269" class="small">p10 · median · p90</text>
    </g>
    <text x="18" y="447" class="small"><tspan x="18">Per-target family median</tspan><tspan x="18" dy="22">normalization · frozen weights</tspan></text>
  </g>
  <path d="M845 395H878" class="arrow"/>

  <g transform="translate(885 150)">
    <rect width="235" height="490" rx="10" fill="#102337" stroke="#aa7837"/>
    <text x="18" y="48" class="num" fill="#ffad4a">4.</text><text x="68" y="45" class="head">Dual Top 10</text>
    <text x="18" y="82" class="body"><tspan x="18">Same complete retrieval</tspan><tspan x="18" dy="26">library, two hypotheses</tspan></text>
    <rect x="18" y="146" width="199" height="100" rx="7" fill="#17283b"/>
    <text x="31" y="175" class="label" fill="#aebdcb">LEGACY</text><text x="31" y="203" class="small">Capped spectral / envelope</text><text x="31" y="225" class="small">/ loudness objective</text>
    <rect x="18" y="264" width="199" height="126" rx="7" fill="#241e40"/>
    <text x="31" y="293" class="label" fill="#ae83ff">NEW PERCEPTUAL</text><text x="31" y="321" class="small">Score + 4 contributions</text><text x="31" y="343" class="small">Eligibility + audio</text><text x="31" y="365" class="small">Target / candidate plots</text>
    <text x="18" y="440" class="small">No automatic “can reproduce” claim</text>
  </g>
  <path d="M1125 395H1158" class="arrow"/>

  <g transform="translate(1165 150)">
    <rect width="190" height="490" rx="10" fill="#102337" stroke="#a94a56"/>
    <text x="16" y="48" class="num" fill="#ff6474">5.</text><text x="65" y="45" class="head">Listen</text>
    <text x="16" y="84" class="body"><tspan x="16">Human audit for</tspan><tspan x="16" dy="26">every target</tspan></text>
    <text x="16" y="160" class="small"><tspan x="16">NEW BETTER</tspan><tspan x="16" dy="27">ROUGHLY SAME</tspan><tspan x="16" dy="27">LEGACY BETTER</tspan><tspan x="16" dy="27">NEITHER CLOSE</tspan><tspan x="16" dy="27">PENDING</tspan></text>
    <line x1="16" y1="310" x2="174" y2="310" class="line"/>
    <text x="16" y="346" class="small"><tspan x="16">Plausible neighborhood?</tspan><tspan x="16" dy="27">YES / NO / UNCLEAR</tspan></text>
    <text x="16" y="440" class="small"><tspan x="16">Saved locally;</tspan><tspan x="16" dy="22">never inferred</tspan></text>
  </g>
  <path d="M1360 395H1393" class="arrow"/>

  <g transform="translate(1400 150)">
    <rect width="155" height="490" rx="10" fill="#102337" stroke="#347b5b"/>
    <text x="14" y="48" class="num" fill="#3dd790">6.</text><text x="14" y="84" class="head">Refine</text>
    <text x="14" y="124" class="body"><tspan x="14">Highest-ranked</tspan><tspan x="14" dy="25">search-eligible</tspan><tspan x="14" dy="25">preset is Base</tspan></text>
    <rect x="14" y="225" width="127" height="94" rx="7" fill="#143429"/>
    <text x="27" y="254" class="label" fill="#3dd790">CMA-ES</text><text x="27" y="280" class="small">Unchanged</text><text x="27" y="302" class="small">manual start</text>
    <text x="14" y="382" class="small"><tspan x="14">Playable piano</tspan><tspan x="14" dy="23">+ editable patch</tspan><tspan x="14" dy="23">preserved</tspan></text>
  </g>

  <g transform="translate(45 680)">
    <rect width="1510" height="78" rx="9" fill="#0d1d2c" stroke="#294056"/>
    <text x="18" y="28" class="label" fill="#9fb0c3">LAYER IMPACT</text>
    <text x="18" y="56" class="body">Backend cache + descriptors + ranking</text><text x="410" y="56" class="body">Thin browser audit UI</text><text x="720" y="56" class="body">Local human labels</text><text x="1030" y="56" class="body">Real CLAP state/audio hashes</text>
  </g>
  <g transform="translate(45 782)">
    <rect width="360" height="82" rx="8" fill="#17283b"/><text x="16" y="28" class="label" fill="#aebdcb">CURRENT STATE</text><text x="16" y="56" class="small">120 sampled · 39 eligible · capped metric</text>
    <path d="M410 41H445" class="arrow"/>
    <rect x="450" width="360" height="82" rx="8" fill="#241e40"/><text x="466" y="28" class="label" fill="#ae83ff">CHANGES IN THIS PR</text><text x="466" y="56" class="small">Full library · 2 eligibility classes · dual audit</text>
    <path d="M815 41H850" class="arrow"/>
    <rect x="855" width="330" height="82" rx="8" fill="#392d18"/><text x="871" y="28" class="label" fill="#ffad4a">UNCHANGED / OUT OF SCOPE</text><text x="871" y="56" class="small">CMA · multi-note · uploads · hosting · LOCK</text>
    <path d="M1190 41H1225" class="arrow"/>
    <rect x="1230" width="280" height="82" rx="8" fill="#143429"/><text x="1246" y="28" class="label" fill="#3dd790">INTENDED RESULT</text><text x="1246" y="56" class="small">Evidence whether retrieval improves</text>
  </g>
</svg>
