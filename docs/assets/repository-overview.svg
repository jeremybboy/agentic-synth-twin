<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
  <title id="title">Planned Agentic Synth Twin experiment</title>
  <desc id="desc">A left-to-right workflow in which human sonic intent constrains exact synth states, controlled renders become acoustic measurements, a local surrogate searches candidates, and real-synth verification plus human audition leads to a reproducible locked patch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#20201d"/>
    </marker>
    <style>
      .struct { font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
      .body { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .ink { fill: #20201d; }
      .muted { fill: #625f57; }
      .flow { fill: none; stroke: #20201d; stroke-width: 3; marker-end: url(#arrow); }
      .support { fill: none; stroke: #8c887d; stroke-width: 2; stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="1400" height="690" fill="#f4f0e6"/>
  <text x="64" y="64" class="struct ink" font-size="34">A SYNTH THAT TEACHES US ITS LOCAL BEHAVIOR</text>
  <text x="64" y="98" class="body muted" font-size="20">Planned Prototype 0 workflow · every candidate returns to the real instrument</text>
  <path d="M249 287 H282" class="flow"/>
  <path d="M472 287 H507" class="flow"/>
  <path d="M706 287 H741" class="flow"/>
  <path d="M952 287 H987" class="flow"/>
  <path d="M1173 287 H1207" class="flow"/>
  <g>
    <rect x="64" y="164" width="185" height="246" fill="#e85d3f"/>
    <text x="84" y="199" class="mono ink" font-size="14">01 · HUMAN PRIOR</text>
    <text x="84" y="246" class="struct ink" font-size="26">INTENT + EARS</text>
    <path d="M86 289 C110 267, 134 314, 158 283 S206 300, 226 274" fill="none" stroke="#20201d" stroke-width="4"/>
    <text x="84" y="346" class="body ink" font-size="17">A/B judgments select</text>
    <text x="84" y="369" class="body ink" font-size="17">2–5 active controls.</text>
  </g>
  <g>
    <rect x="282" y="198" width="190" height="212" fill="#f2c14e"/>
    <text x="302" y="233" class="mono ink" font-size="14">02 · EXACT STATE</text>
    <text x="302" y="276" class="struct ink" font-size="25">SYNTH SETTINGS</text>
    <line x1="306" y1="310" x2="446" y2="310" stroke="#20201d" stroke-width="3"/>
    <circle cx="350" cy="310" r="9" fill="#20201d"/>
    <line x1="306" y1="344" x2="446" y2="344" stroke="#20201d" stroke-width="3"/>
    <circle cx="410" cy="344" r="9" fill="#20201d"/>
    <text x="302" y="387" class="body ink" font-size="16">Known parameter vector</text>
  </g>
  <g>
    <rect x="507" y="143" width="199" height="267" fill="#66a6a1"/>
    <text x="527" y="178" class="mono ink" font-size="14">03 · CONTROLLED</text>
    <text x="527" y="221" class="struct ink" font-size="26">REAL RENDERS</text>
    <path d="M528 288 C542 256, 556 325, 570 275 S598 313, 612 265 S640 325, 654 278 S682 303, 688 276" fill="none" stroke="#20201d" stroke-width="4"/>
    <line x1="528" y1="335" x2="685" y2="335" stroke="#20201d" stroke-width="2"/>
    <text x="527" y="370" class="body ink" font-size="16">Fixed audition input</text>
  </g>
  <g>
    <rect x="741" y="183" width="211" height="227" fill="#40798c"/>
    <text x="761" y="218" class="mono" fill="#f4f0e6" font-size="14">04 · MEASURE</text>
    <text x="761" y="261" class="struct" fill="#f4f0e6" font-size="25">ACOUSTIC DATA</text>
    <polyline points="763,338 786,318 809,327 832,280 855,309 878,270 901,301 928,289" fill="none" stroke="#f4f0e6" stroke-width="4"/>
    <text x="761" y="377" class="body" fill="#f4f0e6" font-size="16">Audio + DSP record</text>
  </g>
  <g>
    <rect x="987" y="221" width="186" height="189" fill="#8f6aa8"/>
    <text x="1007" y="256" class="mono" fill="#ffffff" font-size="14">05 · SEARCH</text>
    <text x="1007" y="292" class="struct" fill="#ffffff" font-size="23">LOCAL</text>
    <text x="1007" y="318" class="struct" fill="#ffffff" font-size="23">SURROGATE</text>
    <circle cx="1021" cy="351" r="7" fill="#ffffff"/>
    <circle cx="1061" cy="337" r="7" fill="#ffffff"/>
    <circle cx="1100" cy="360" r="7" fill="#ffffff"/>
    <circle cx="1141" cy="333" r="7" fill="#ffffff"/>
    <path d="M1021 351 L1061 337 L1100 360 L1141 333" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="1007" y="389" class="body" fill="#ffffff" font-size="16">Proposes, never proves</text>
  </g>
  <g>
    <rect x="1207" y="153" width="129" height="257" fill="#20201d"/>
    <text x="1227" y="188" class="mono" fill="#f4f0e6" font-size="14">06 · VERIFY</text>
    <text x="1227" y="231" class="struct" fill="#f4f0e6" font-size="25">REAL</text>
    <text x="1227" y="261" class="struct" fill="#f4f0e6" font-size="25">SYNTH</text>
    <path d="M1228 302 H1315" stroke="#e85d3f" stroke-width="5"/>
    <text x="1227" y="342" class="body" fill="#f4f0e6" font-size="16">Measure</text>
    <text x="1227" y="365" class="body" fill="#f4f0e6" font-size="16">Audition</text>
    <text x="1227" y="392" class="struct" fill="#f2c14e" font-size="20">LOCK</text>
  </g>
  <path d="M1180 450 V490 H370 V450" class="support"/>
  <rect x="350" y="490" width="850" height="122" fill="#ded8ca"/>
  <text x="374" y="526" class="mono ink" font-size="14">REPRODUCIBILITY SPINE</text>
  <text x="374" y="565" class="struct ink" font-size="22">EXACT STATE</text>
  <text x="537" y="565" class="struct ink" font-size="22">FIXED AUDITION</text>
  <text x="741" y="565" class="struct ink" font-size="22">MEASURED EVIDENCE</text>
  <text x="1000" y="565" class="struct ink" font-size="22">RELOAD TEST</text>
  <text x="374" y="592" class="body muted" font-size="16">A patch is not locked until restored and rerendered.</text>
  <text x="64" y="651" class="body muted" font-size="15">PR 0 documents this planned experiment; implementation begins only after human review.</text>
</svg>
